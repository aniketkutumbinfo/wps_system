<div class="card">
    <p-table #dt1 dataKey="code" [value]="getAllPafFilesList" [scrollable]="true" [paginator]="true" [rows]="10"
             [rowsPerPageOptions]="[10, 25, 50]" [selectionPageOnly]="true" [tableStyle]="{'min-width': '50rem'}">
        <ng-template pTemplate="header">
            <tr>
                <th style="min-width:200px">PAF File Name</th>
                <th style="min-width:200px">File Reason</th>
                <th style="min-width:200px">File Status</th>
                <th style="min-width:200px">File Creation Date</th>
                <th style="min-width:200px">Maker Date</th>
                <!-- <th style="min-width:200px">Optional 1</th> -->
                <th style="min-width:200px">Action</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-data>
            <tr>
                <td>{{data.pafFileName}}</td>
                <td>{{data.fileReason}}</td>
                <td>{{data.fileStatus}}</td>
                <td>{{data.fileCreationDate}}</td>
                <td>{{data.makerDate}}</td>
                <!-- <td>{{data.optional1}}</td> -->
                <td>
                    <p-button pRipple [outlined]="true" label="View" (click)="viewPrcDetail(data)" icon="pi pi-eye" />
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td class="text-center" [attr.colspan]="6"> <!-- Adjust colspan to match the number of columns -->
                    No records found
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
