<div class="card">
    <div>
        <p-button severity="primary" label="Sync" (click)="SyncData()" />
    </div>
    <p-table #dt1 dataKey="code" [value]="getAllRfaFilesList" [scrollable]="true" [paginator]="true" [rows]="10"
        [rowsPerPageOptions]="[10, 25, 50]" [selectionPageOnly]="true" [tableStyle]="{'min-width': '50rem'}">
        <ng-template pTemplate="header">
            <tr>
                <th style="min-width:200px">RFA File Name</th>
                <th style="min-width:200px">File Reason</th>
                <th style="min-width:200px">File Status</th>
                <th style="min-width:200px">File Creation Date</th>
                <th style="min-width:200px">Maker Date</th>
                <th style="min-width:200px">Action</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-data>
            <tr>
                <td>{{ data.rfaFileName }}</td>
                <td>{{ data.fileReason }}</td>
                <td>{{ data.fileStatus }}</td>
                <td>{{ data.fileCreationDate | date }}</td>
                <td>{{ data.makerDate | date }}</td>
                <td>
                    <p-button pRipple badgeClass="p-badge-contrast" [outlined]="true" label="View" (click)="viewPrcDetail(data)" icon="pi pi-eye" />
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td class="text-center" [attr.colspan]="6">
                    No records found
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
<p-toast></p-toast>
