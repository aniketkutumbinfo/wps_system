<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Corporate Profile</h3>
                </div>
                <div class="card-body">
                    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" class="form-control" formControlName="fullName"
                                [readonly]="!isEditing">
                        </div>

                        <div class="form-group mt-3">
                            <label for="email">Email</label>
                            <input type="email" id="email" class="form-control" formControlName="email"
                                [readonly]="!isEditing">
                        </div>

                        <div class="form-group mt-3">
                            <label for="phone">Phone</label>
                            <input type="text" id="phone" class="form-control" formControlName="mobile"
                                [readonly]="!isEditing">
                        </div>

                        <div class="form-group mt-3">
                            <label for="role">Role</label>
                            <select id="role" class="form-control" formControlName="role" [disabled]="!isEditing">
                                <option *ngFor="let role of roles" [value]="role.value">
                                    {{ role.label }}
                                </option>
                            </select>
                        </div>

                        <div class="form-group mt-3">
                            <button type="button" class="btn btn-secondary" (click)="toggleEdit()">
                                {{ isEditing ? 'Cancel' : 'Edit' }}
                            </button>
                            <button type="submit" class="btn btn-primary ml-2" [disabled]="!isEditing">
                                Save
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<p-toast></p-toast>
