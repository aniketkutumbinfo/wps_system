<div class="card">
    <form (ngSubmit)="updateCase()" #updateForm="ngForm">
        <div class="row m-2">
            <div class="col-3">
                <label for="empId" class="form-label">
                    Emp Id
                </label>
                <input id="empId" class="form-control" readonly type="text" [(ngModel)]="txnDetail.empId" name="empId"
                    pInputText>
            </div>
            <div class="col-3">
                <label for="pafFileName" class="form-label">
                    PAF File Name
                </label>
                <input id="pafFileName" class="form-control" readonly type="text" [(ngModel)]="txnDetail.pafFileName"
                    name="pafFileName" pInputText>
            </div>
            <div class="col-3">
                <label for="txnDate" class="form-label">
                    Txn Date
                </label>
                <input id="txnDate" class="form-control" readonly type="text" [(ngModel)]="txnDetail.txnDate"
                    name="txnDate" pInputText>
            </div>
            <div class="col-3">
                <label for="txnRefNo" class="form-label">
                    Txn Ref No
                </label>
                <input id="txnRefNo" class="form-control" readonly type="text" [(ngModel)]="txnDetail.txnRefNo"
                    name="txnRefNo" pInputText>
            </div>
        </div>
        <br>
        <div class="row m-2">
            <div class="col-3">
                <label for="availableBal" class="form-label">
                    Available Bal
                </label>
                <input id="availableBal" class="form-control" type="number" [(ngModel)]="txnDetail.availableBal"
                    name="availableBal" pInputText required>
                <div *ngIf="updateForm.submitted && !txnDetail.availableBal" class="invalid-feedback">
                    Available Balance is required.
                </div>
            </div>
            <div class="col-3">
                <label for="remmitAmt" class="form-label">
                    Remmit Amt
                </label>
                <input id="remmitAmt" class="form-control" type="number" [(ngModel)]="txnDetail.remmitAmt"
                    name="remmitAmt" pInputText required>
                <div *ngIf="updateForm.submitted && !txnDetail.remmitAmt" class="invalid-feedback">
                    Remmit Amount is required.
                </div>
            </div>
            <div class="col-3">
                <label for="totalTxnAmt" class="form-label">
                    Total Txn Amt
                </label>
                <input id="totalTxnAmt" class="form-control" type="number" [(ngModel)]="txnDetail.totalTxnAmt"
                    name="totalTxnAmt" pInputText required>
                <div *ngIf="updateForm.submitted && !txnDetail.totalTxnAmt" class="invalid-feedback">
                    Total Transaction Amount is required.
                </div>
            </div>
            <div class="col-3">
                <label for="txnAmt" class="form-label">
                    Txn Amt
                </label>
                <input id="txnAmt" class="form-control" type="number" [(ngModel)]="txnDetail.txnAmt" name="txnAmt"
                    pInputText required>
                <div *ngIf="updateForm.submitted && !txnDetail.txnAmt" class="invalid-feedback">
                    Transaction Amount is required.
                </div>
            </div>
        </div>
        <br>
        <div class="row m-2">
            <div class="col-3">
                <label for="pafStatusForFile" class="form-label">
                    Paf Status For File
                </label>
                <input id="pafStatusForFile" class="form-control" readonly type="text"
                    [(ngModel)]="txnDetail.pafStatusForFile" name="pafStatusForFile" pInputText>
            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="col-12 d-flex justify-content-start m-2">
                    <p-button pRipple icon="pi pi-check" type="submit" [rounded]="true" [outlined]="true"
                        label="Update" styleClass="p-button-primary me-2" />
                    <p-button pRipple icon="pi pi-times" [rounded]="true" [outlined]="true" label="Cancel"
                        styleClass="p-button-secondary" (click)="this.router.navigate(['/dif/transaction'])" />
                </div>
            </div>
        </div>
    </form>
</div>
<p-toast></p-toast>
