<div class="login-container">
    <div class="container">
        <div class="row">
            <div class="col-12 col-sm-6">
                <div class="left-block">
                </div>
            </div>
            <div class="col-12 col-sm-6">
                <div class="right-block">
                    <div class="logo"><img src="../assets/images/dummy-logo.png" /></div>
                    <h2>Welcome !</h2>
                    <p>Forgot Password your account</p>
                    <div class="field-block">
                        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
                            <div class="input-block">
                                <label class="fieldtitle" for="email">Email Address</label>
                                <input type="email" id="email" class="form-control" placeholder="Enter your email"
                                    formControlName="email" />
                                <div *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched"
                                    class="text-danger">
                                    A valid email is required.
                                </div>
                            </div>
                            <button type="submit" name="signup" class="signin-btn"
                                [disabled]="forgotPasswordForm.invalid">Send Reset Link</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="clearfix"></div>
</div>
