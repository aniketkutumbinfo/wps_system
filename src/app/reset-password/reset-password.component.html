<div class="login-container">
    <div class="container">
        <div class="row">
            <div class="col-12 col-sm-6">
                <div class="left-block">
                </div>
            </div>
            <div class="col-12 col-sm-6">
                <div class="right-block">
                    <div class="logo"><img src="../assets/images/dummy-logo.png" /></div>
                    <h2>Welcome !</h2>
                    <p>Reset Password your account</p>
                    <div class="field-block">
                        <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
                            <div class="input-block">
                                <label class="fieldtitle" for="newPassword">New Password</label>
                                <input type="password" id="newPassword" class="form-control"
                                    placeholder="Enter new password" formControlName="newPassword" />
                                <div *ngIf="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.touched"
                                    class="text-danger">
                                    Password is required and must be at least 6 characters long.
                                </div>
                            </div>

                            <div class="input-block">
                                <label class="fieldtitle" for="confirmPassword">Confirm Password</label>
                                <input type="password" id="confirmPassword" class="form-control"
                                    placeholder="Confirm new password" formControlName="confirmPassword" />
                                <div *ngIf="resetPasswordForm.hasError('mismatch') && resetPasswordForm.get('confirmPassword')?.touched"
                                    class="text-danger">
                                    Passwords must match.
                                </div>
                            </div>

                            <button type="submit" name="reset" class="signin-btn"
                                [disabled]="resetPasswordForm.invalid">Reset Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="clearfix"></div>
</div>
