<div class="login-container">
    <div class="container">
        <div class="row">
            <div class="col-12 col-sm-6">
                <div class="left-block">
                </div>
            </div>
            <div class="col-12 col-sm-6">
                <div class="right-block">
                    <div class="logo"><img src="../assets/images/dummy-logo.png" /></div>
                    <h2>Welcome !</h2>
                    <p>Create your account</p>
                    <div class="field-block">
                        <form (ngSubmit)="onSubmit()" #signUpForm="ngForm">
                            <div class="input-block">
                                <label class="fieldtitle" for="name">Name</label>
                                <input type="text" id="name" class="form-control" placeholder="Enter your name" required
                                    [(ngModel)]="user.name" name="name" #name="ngModel" />
                                <div *ngIf="name.invalid && name.touched" class="text-danger">
                                    Name is required.
                                </div>
                            </div>

                            <div class="input-block">
                                <label class="fieldtitle" for="email">Email</label>
                                <input type="email" id="email" class="form-control" placeholder="Enter your email"
                                    required [(ngModel)]="user.email" name="email" #email="ngModel" />
                                <div *ngIf="email.invalid && email.touched" class="text-danger">
                                    A valid email is required.
                                </div>
                            </div>

                            <div class="input-block">
                                <label class="fieldtitle" for="password">Password</label>
                                <input type="password" id="password" class="form-control"
                                    placeholder="Enter your password" required [(ngModel)]="user.password"
                                    name="password" #password="ngModel" />
                                <div *ngIf="password.invalid && password.touched" class="text-danger">
                                    Password is required.
                                </div>
                            </div>

                            <div class="input-block">
                                <label class="fieldtitle" for="confirmPassword">Confirm Password</label>
                                <input type="password" id="confirmPassword" class="form-control"
                                    placeholder="Confirm your password" required [(ngModel)]="confirmPassword"
                                    name="confirmPassword" #confirmPasswordField="ngModel" />
                                <div *ngIf="confirmPasswordField.invalid && confirmPasswordField.touched"
                                    class="text-danger">
                                    Confirm Password is required.
                                </div>
                                <div *ngIf="password.value !== confirmPassword" class="text-danger mt-2">
                                    Passwords must match.
                                </div>
                            </div>
                            <button type="submit" name="signup" class="signin-btn"
                                [disabled]="signUpForm.invalid || password.value !== confirmPassword">Sign
                                Up</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="clearfix"></div>
</div>
