<div class="login-container">
    <div class="container">
        <div class="row">
            <div class="col-12 col-sm-6">
                <div class="left-block">
                </div>
            </div>
            <div class="col-12 col-sm-6">
                <div class="right-block">
                    <div class="logo"><img src="../assets/images/dummy-logo.png" /></div>
                    <h2>Welcome !</h2>
                    <p>Create your account</p>
                    <div class="field-block">
                        <form (ngSubmit)="onSubmit()" #signUpForm="ngForm">
                            <div class="input-block">
                                <label class="fieldtitle" for="fullName">Full Name</label>
                                <input type="text" id="fullName" class="form-control" placeholder="Enter your Full Name"
                                    required [(ngModel)]="user.fullName" name="fullName" #fullName="ngModel" />
                                <div *ngIf="fullName.invalid && fullName.touched" class="text-danger">
                                    Full Name is required.
                                </div>
                            </div>

                            <div class="input-block">
                                <label class="fieldtitle" for="email">Email</label>
                                <input type="email" id="email" class="form-control" placeholder="Enter your email"
                                    required [(ngModel)]="user.email" name="email" #email="ngModel" />
                                <div *ngIf="email.invalid && email.touched" class="text-danger">
                                    A valid email is required.
                                </div>
                            </div>

                            <div class="input-block">
                                <label class="fieldtitle" for="password">Password</label>
                                <input type="password" id="password" class="form-control"
                                    placeholder="Enter your password" required [(ngModel)]="user.password"
                                    name="password" #password="ngModel" />
                                <div *ngIf="password.invalid && password.touched" class="text-danger">
                                    Password is required.
                                </div>
                            </div>

                            <div class="input-block">
                                <label class="fieldtitle" for="confirmPass">Confirm Password</label>
                                <input type="password" id="confirmPass" class="form-control"
                                    placeholder="Confirm your password" required [(ngModel)]="confirmPass"
                                    name="confirmPass" #confirmPasswordField="ngModel" />
                                <div *ngIf="confirmPasswordField.invalid && confirmPasswordField.touched"
                                    class="text-danger">
                                    Confirm Password is required.
                                </div>
                                <div *ngIf="password.value !== confirmPass" class="text-danger mt-2">
                                    Passwords must match.
                                </div>
                            </div>

                            <div class="input-block">
                                <label class="fieldtitle" for="role">Role</label>
                                <select id="role" class="form-control" [(ngModel)]="user.role" name="role" required>
                                    <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
                                </select>
                                <div *ngIf="!user.role && signUpForm.submitted" class="text-danger">
                                    Role is required.
                                </div>
                            </div>

                            <div class="input-block">
                                <label class="fieldtitle" for="mobile">Mobile Number</label>
                                <input type="tel" id="mobile" class="form-control"
                                    placeholder="Enter your mobile number" required [(ngModel)]="user.mobile"
                                    name="mobile" #mobile="ngModel" pattern="[0-9]{10}" />
                                <div *ngIf="mobile.invalid && mobile.touched" class="text-danger">
                                    A valid mobile number is required (10 digits).
                                </div>
                            </div>


                            <button type="submit" name="signup" class="signin-btn mb-2"
                                [disabled]="signUpForm.invalid || password.value !== confirmPass">Sign
                                Up</button>
                            <button type="button" name="login" routerLink="/login" class="signin-btn">Back To Login
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="clearfix"></div>
</div>
